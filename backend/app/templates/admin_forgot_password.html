<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Admin Password — Hisaab</title>
  <style>
    :root {
      --brand: #dc2626;
      --brand-end: #b91c1c;
      --border: #e5e5e5;
      --text: #171717;
      --muted: #737373;
      --income: #059669;
      --income-soft: #ecfdf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #1c1f2e 0%, #171717 60%);
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      padding: 2.25rem;
      width: 100%;
      max-width: 360px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.4rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-end) 100%);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin: 0 0 1.75rem; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.35rem;
    }
    input {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      margin-bottom: 1.1rem;
      background: #f9fafb;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--brand);
      background: white;
      box-shadow: 0 0 0 3px #fef2f2;
    }
    button {
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-end) 100%);
      color: white;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    button:hover { box-shadow: 0 6px 16px rgba(220, 38, 38, 0.35); transform: translateY(-1px); }
    .message {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      background: var(--income-soft);
      color: #15803d;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      font-size: 0.82rem;
      line-height: 1.45;
      margin-bottom: 1.1rem;
    }
    .hint {
      margin: 1.4rem 0 0;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
    .hint a { color: var(--brand); font-weight: 600; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5h-4a2 2 0 0 1 0-4z" /></svg>
      </span>
      Admin Dashboard
    </div>
    <p class="subtitle">Enter your admin email and we'll generate a reset link.</p>

    {% if message %}
    <div class="message">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      {{ message }}
    </div>
    {% endif %}

    <form method="post">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus />
      <button type="submit">Send Reset Link</button>
    </form>
    <p class="hint"><a href="{{ url_for('admin_dashboard.login') }}">Back to login</a></p>
  </div>
</body>
</html>
