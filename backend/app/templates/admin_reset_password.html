<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Admin Password — Expense Tracker</title>
  <style>
    :root {
      --brand: #4f46e5;
      --brand-end: #7c3aed;
      --border: #e7e9f0;
      --text: #111827;
      --muted: #6b7280;
      --expense: #dc2626;
      --expense-soft: #fef2f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
      background: radial-gradient(circle at top, #1c1f2e 0%, #0f1117 60%);
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      padding: 2.25rem;
      width: 100%;
      max-width: 360px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.4rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-end) 100%);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin: 0 0 1.75rem; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.35rem;
    }
    input {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      margin-bottom: 1.1rem;
      background: #f9fafb;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--brand);
      background: white;
      box-shadow: 0 0 0 3px #eef2ff;
    }
    button {
      width: 100%;
      padding: 0.7rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-end) 100%);
      color: white;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
    }
    button:hover { box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35); transform: translateY(-1px); }
    .error {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--expense-soft);
      color: #b91c1c;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      font-size: 0.84rem;
      margin-bottom: 1.1rem;
    }
    .hint {
      margin: 1.4rem 0 0;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
    .hint a { color: var(--brand); font-weight: 600; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5h-4a2 2 0 0 1 0-4z" /></svg>
      </span>
      Admin Dashboard
    </div>

    {% if expired %}
      <p class="subtitle">This reset link is invalid or has expired.</p>
      <div class="error">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Reset links expire after 30 minutes and can only be used once.
      </div>
      <p class="hint"><a href="{{ url_for('admin_dashboard.forgot_password') }}">Request a new link</a></p>
    {% else %}
      <p class="subtitle">Choose a new password for your admin account.</p>

      {% if error %}
      <div class="error">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="post">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" minlength="6" required autofocus />
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" minlength="6" required />
        <button type="submit">Reset Password</button>
      </form>
      <p class="hint"><a href="{{ url_for('admin_dashboard.login') }}">Back to login</a></p>
    {% endif %}
  </div>
</body>
</html>
